<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projet OG — Ober'Games 2027</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       IMAGE PRINCIPALE
       ========================= */

    .vault-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .vault-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      user-select: none;
      pointer-events: none;
    }


    /* =========================
       ZONE INTERACTIVE
       ========================= */

    .login-zone {
      position: absolute;

      /*
       * Position correspondant au cadre
       * présent dans l'image.
       */
      right: 7.5%;
      top: 39%;

      width: 30%;
      height: 30%;

      display: flex;
      flex-direction: column;

      pointer-events: none;
    }


    /* Champs transparents */

    .login-input {
      position: absolute;

      left: 8%;
      width: 84%;

      height: 15%;

      border: none;
      outline: none;

      background: transparent;

      color: white;

      font-size: clamp(14px, 1.2vw, 20px);

      padding: 0 15px;

      pointer-events: auto;

      /*
       * On ne voit pas de nouveau cadre :
       * celui-ci existe déjà dans l'image.
       */
    }

    .login-input::placeholder {
      color: rgba(255,255,255,0);
    }

    .login-input:focus {
      background: rgba(255,255,255,.025);
    }

    #identifier {
      top: 16%;
    }

    #password {
      top: 39%;
    }


    /* =========================
       BOUTON INVISIBLE
       ========================= */

    .open-button {
      position: absolute;

      left: 8%;
      width: 84%;

      top: 62%;
      height: 18%;

      border: none;
      background: transparent;

      cursor: pointer;

      pointer-events: auto;
    }

    .open-button:hover {
      background: rgba(255,255,255,.035);
    }

    .open-button:active {
      background: rgba(255,255,255,.08);
    }


    /* =========================
       MESSAGE D'ERREUR
       ========================= */

    .message {
      position: absolute;

      left: 5%;
      width: 90%;

      top: 83%;

      text-align: center;

      color: rgba(255,255,255,.8);

      font-size: clamp(8px, .8vw, 13px);

      letter-spacing: 2px;

      pointer-events: none;
    }


    /* =========================
       COMPTE À REBOURS
       ========================= */

    .countdown {
      position: absolute;

      left: 9%;
      bottom: 17%;

      color: rgba(255,255,255,.75);

      font-size: clamp(9px, 1vw, 15px);

      letter-spacing: 3px;

      text-shadow:
        0 2px 5px #000,
        0 0 10px #000;

      pointer-events: none;
    }


    /* =========================
       ANIMATION D'OUVERTURE
       ========================= */

    .vault-screen.unlocking .vault-image {
      animation:
        vaultLight 1.4s ease forwards;
    }

    .vault-screen.unlocking .login-zone {
      animation:
        interfaceFade .7s ease forwards;
    }

    @keyframes vaultLight {

      0% {
        filter: brightness(1);
      }

      45% {
        filter: brightness(1.35);
      }

      100% {
        filter: brightness(.15);
        transform: scale(1.02);
      }
    }

    @keyframes interfaceFade {

      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      .vault-image {
        object-position: 55% center;
      }

      /*
       * Sur téléphone le panneau de connexion
       * occupe davantage de largeur.
       */

      .login-zone {
        right: 4%;
        top: 49%;

        width: 53%;
        height: 29%;
      }

      .login-input {
        font-size: 14px;
        padding: 0 8px;
      }

      .countdown {
        left: 6%;
        bottom: 4%;

        font-size: 8px;
        letter-spacing: 1.5px;
      }

      .message {
        font-size: 8px;
      }
    }

  </style>
</head>


<body>

  <main class="vault-screen" id="vaultScreen">

    <!-- IMAGE DU COFFRE -->
    <img
      src="login-vault.jpg"
      class="vault-image"
      alt=""
    >


    <!--
      ZONES INTERACTIVES INVISIBLES
    -->

    <form
      class="login-zone"
      id="login-form"
    >

      <input
        id="identifier"
        class="login-input"
        type="text"
        autocomplete="username"
        aria-label="Identifiant"
        required
      >

      <input
        id="password"
        class="login-input"
        type="password"
        autocomplete="current-password"
        aria-label="Mot de passe"
        required
      >

      <button
        class="open-button"
        type="submit"
        aria-label="Ouvrir le coffre"
      ></button>

      <div
        class="message"
        id="login-message"
      ></div>

    </form>


    <!-- COMPTE À REBOURS -->

    <div
      class="countdown"
      id="countdown"
    >
      CHARGEMENT...
    </div>

  </main>


  <script>

    /*
     * ============================
     * SUPABASE
     * ============================
     */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /*
     * ============================
     * COMPTE À REBOURS
     * ============================
     */

    const eventDate =
      new Date(
        "2027-06-12T11:00:00+02:00"
      ).getTime();


    function updateCountdown() {

      const now =
        Date.now();

      const difference =
        eventDate - now;


      if (difference <= 0) {

        document
          .getElementById("countdown")
          .textContent =
          "LES OBER’GAMES ONT COMMENCÉ";

        return;
      }


      const days =
        Math.floor(
          difference /
          (1000 * 60 * 60 * 24)
        );

      const hours =
        Math.floor(
          (difference /
          (1000 * 60 * 60)) % 24
        );

      const minutes =
        Math.floor(
          (difference /
          (1000 * 60)) % 60
        );

      const seconds =
        Math.floor(
          (difference / 1000) % 60
        );


      document
        .getElementById("countdown")
        .textContent =
        `${days}J ` +
        `${String(hours).padStart(2,"0")}H ` +
        `${String(minutes).padStart(2,"0")}M ` +
        `${String(seconds).padStart(2,"0")}S`;
    }


    updateCountdown();

    setInterval(
      updateCountdown,
      1000
    );


    /*
     * ============================
     * CONNEXION
     * ============================
     *
     * Le système identifiant →
     * compte Supabase sera branché
     * à l'étape suivante.
     */

    document
      .getElementById("login-form")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const identifier =
            document
              .getElementById("identifier")
              .value
              .trim();

          const password =
            document
              .getElementById("password")
              .value;


          const message =
            document
              .getElementById("login-message");


          message.textContent =
            "VÉRIFICATION...";


          /*
           * Pour le moment, on teste uniquement
           * l'animation visuelle.
           *
           * L'authentification réelle sera branchée
           * juste après.
           */

          if (
            identifier === "Simon-admin" &&
            password === "Ober’games2027"
          ) {

            message.textContent =
              "ACCÈS AUTORISÉ";

            document
              .getElementById("vaultScreen")
              .classList
              .add("unlocking");


            /*
             * TEMPORAIRE :
             * la véritable ouverture de la porte
             * sera ajoutée ensuite.
             */

            setTimeout(() => {

              window.location.href =
                "/admin/";

            }, 1500);


          } else {

            message.textContent =
              "ACCÈS REFUSÉ";

          }

        }
      );

  </script>

</body>
</html>
