<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ober'Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #050505;
            color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .welcome {
            text-align: center;
            padding: 30px;
        }

        .welcome h1 {
            font-size: clamp(40px, 10vw, 90px);
            letter-spacing: 0.18em;
            margin: 0 0 20px;
        }

        .welcome p {
            color: #888;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="welcome">
        <h1>OBER'GAMES</h1>
        <p>Accès au dossier en préparation</p>
    </main>

</body>
</html>
