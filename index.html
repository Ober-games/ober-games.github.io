<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ober'Games 2027</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at center, #1b1b1b 0%, #080808 55%, #000 100%);
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .logo {
      display: block;
      max-width: 420px;
      width: 80%;
      margin: 10px auto 35px;
    }

    .classified {
      text-align: center;
      letter-spacing: 5px;
      font-size: 11px;
      color: #777;
      margin-bottom: 25px;
    }

    .hero {
      text-align: center;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 30px 10px;
    }

    .date {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .time {
      margin-top: 10px;
      font-size: 18px;
      color: #aaa;
    }

    .address {
      margin-top: 20px;
      color: #bbb;
      font-size: 14px;
    }

    .countdown {
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .login-section {
      max-width: 450px;
      margin: 50px auto 0;
      padding: 30px;
      border: 1px solid #333;
      background: rgba(10,10,10,.8);
    }

    .login-title {
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #999;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #111;
      color: white;
      border: 1px solid #444;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #888;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 1px solid #777;
      background: #eee;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 2px;
    }

    button:hover {
      background: white;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      color: #aaa;
      font-size: 14px;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="classified">
      DOSSIER — OG / 2027
    </div>

    <!-- Logo Ober'Games -->
    <img
      class="logo"
      src="logo-obergames.png"
      alt="Ober'Games"
    >

    <section class="hero">

      <div class="date">
        12 JUIN 2027
      </div>

      <div class="time">
        11H00
      </div>

      <div class="address">
        9 rue des Vignes<br>
        67360 OBERDORF-SPACHBACH
      </div>

      <div class="countdown" id="countdown">
        CHARGEMENT...
      </div>

    </section>

    <section class="login-section">

      <div class="login-title">
        ACCÈS AU DOSSIER
      </div>

      <form id="login-form">

        <label for="identifier">
          IDENTIFIANT
        </label>

        <input
          id="identifier"
          type="text"
          autocomplete="username"
          required
        >

        <label for="password">
          MOT DE PASSE
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">
          OUVRIR LE DOSSIER
        </button>

        <div class="message" id="login-message"></div>

      </form>

    </section>

    <footer>
      OBER'GAMES — CLASSIFIED
    </footer>

  </main>

  <script>

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    /*
      Pour le moment, cette fonction sert uniquement
      à vérifier que la connexion Supabase fonctionne.
    */

    document
      .getElementById("login-form")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const identifier =
          document.getElementById("identifier").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("login-message");

        message.textContent = "AUTHENTIFICATION...";

        /*
          L'identifiant sera relié plus tard à l'adresse
          technique du compte Supabase.

          Pour notre premier test administrateur,
          on utilise directement l'adresse du compte créée
          dans Supabase.
        */

        const email = identifier;

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          message.textContent =
            "ACCÈS REFUSÉ — IDENTIFIANTS INVALIDES";
          return;
        }

        message.textContent =
          "ACCÈS AUTORISÉ";

        setTimeout(() => {
          window.location.href = "/admin/";
        }, 700);

      });


    /*
      COMPTE À REBOURS
    */

    const eventDate =
      new Date("2027-06-12T11:00:00+02:00").getTime();

    function updateCountdown() {

      const now = new Date().getTime();

      const difference = eventDate - now;

      if (difference <= 0) {
        document.getElementById("countdown").textContent =
          "LES OBER'GAMES ONT COMMENCÉ";
        return;
      }

      const days =
        Math.floor(difference / (1000 * 60 * 60 * 24));

      const hours =
        Math.floor(
          (difference / (1000 * 60 * 60)) % 24
        );

      const minutes =
        Math.floor(
          (difference / (1000 * 60)) % 60
        );

      const seconds =
        Math.floor(
          (difference / 1000) % 60
        );

      document.getElementById("countdown").textContent =
        `${days}J ${hours}H ${minutes}M ${seconds}S`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

  </script>

</body>
</html>
